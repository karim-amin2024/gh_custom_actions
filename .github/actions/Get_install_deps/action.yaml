name: 'Get And Install Dependencies'
description: 'Fetch the deps and istall them if no chache hit'
inputs:
  chache_disable:
    description: this is a configuration parameter to disable/enable the caching of the deps
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      id: cache
      if: ${{inputs.chache_disable}} == 'false'
      uses: actions/cache@v6
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
